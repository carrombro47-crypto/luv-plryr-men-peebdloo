<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PW Live Player — HLS Proxy Stream</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
:root {
    --bg: #0b0f1a;
    --bg-2: #111827;
    --card: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.09);
    --accent: #6c5ce7;
    --accent-2: #00d2ff;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --danger: #ff5470;
    --ok: #2dd4a7;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 15% -10%, rgba(108,92,231,0.25), transparent 60%),
                radial-gradient(1000px 500px at 110% 10%, rgba(0,210,255,0.15), transparent 60%),
                var(--bg);
    color: var(--text);
    min-height: 100vh;
}

/* ---------- Header ---------- */
header {
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; border-bottom:1px solid var(--border);
    background:rgba(11,15,26,0.7); backdrop-filter: blur(12px);
    position:sticky; top:0; z-index:50;
}
.brand { display:flex; align-items:center; gap:12px; }
.logo {
    width:38px; height:38px; border-radius:10px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    display:flex; align-items:center; justify-content:center;
    font-size:18px; box-shadow:0 4px 18px rgba(108,92,231,0.45);
}
.brand h1 { font-size:18px; font-weight:700; letter-spacing:0.3px; }
.brand small { display:block; font-size:11px; color:var(--muted); font-weight:400; }
.status-pill {
    display:flex; align-items:center; gap:8px;
    padding:6px 14px; border-radius:999px; font-size:12px; font-weight:600;
    background:var(--card); border:1px solid var(--border);
}
.status-pill .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }
.status-pill.online .dot { background:var(--ok); box-shadow:0 0 8px var(--ok); }
.status-pill.error .dot { background:var(--danger); box-shadow:0 0 8px var(--danger); }

/* ---------- Layout ---------- */
main { max-width:1080px; margin:0 auto; padding:28px 20px 60px; }

/* ---------- Config card ---------- */
.card {
    background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:20px 22px; margin-bottom:22px;
    backdrop-filter: blur(8px);
}
.card h2 {
    font-size:13px; text-transform:uppercase; letter-spacing:1.2px;
    color:var(--muted); margin-bottom:14px; font-weight:600;
}
.field { margin-bottom:14px; }
.field label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:600; }
.field input {
    width:100%; padding:11px 14px; border-radius:10px;
    background:rgba(0,0,0,0.35); border:1px solid var(--border);
    color:var(--text); font-size:13px; outline:none; transition:border 0.2s, box-shadow 0.2s;
}
.field input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(108,92,231,0.2); }
.row { display:flex; gap:12px; flex-wrap:wrap; }
.row .field { flex:1; min-width:220px; margin-bottom:0; }

.btn {
    display:inline-flex; align-items:center; gap:8px;
    padding:11px 22px; border:none; border-radius:10px; cursor:pointer;
    font-size:14px; font-weight:600; transition:transform 0.15s, box-shadow 0.2s, opacity 0.2s;
}
.btn:active { transform:scale(0.97); }
.btn-primary {
    background:linear-gradient(135deg, var(--accent), #8e7bff);
    color:#fff; box-shadow:0 4px 18px rgba(108,92,231,0.4);
}
.btn-primary:hover { box-shadow:0 6px 24px rgba(108,92,231,0.55); }
.btn-ghost { background:var(--card); color:var(--text); border:1px solid var(--border); }
.btn-ghost:hover { border-color:var(--accent); }
.actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }

/* ---------- Player ---------- */
.player-card { padding:0; overflow:hidden; }
.player-topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 18px; border-bottom:1px solid var(--border);
}
.live-badge { display:none; align-items:center; gap:8px; }
.live-badge.show { display:flex; }
.live-dot { width:9px; height:9px; background:#ff2d2d; border-radius:50%; animation:blink 1s infinite; box-shadow:0 0 8px #ff2d2d; }
@keyframes blink { 50% { opacity:0.25; } }
.live-text { font-size:12px; font-weight:700; letter-spacing:1px; color:#ff5c5c; }
.player-title { font-size:13px; color:var(--muted); }
.player-controls-right { display:flex; gap:8px; align-items:center; }
select.quality {
    background:rgba(0,0,0,0.35); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:6px 10px; font-size:12px; outline:none; cursor:pointer;
}

.video-shell { position:relative; width:100%; aspect-ratio:16/9; background:#000; }
#video { width:100%; height:100%; object-fit:contain; display:block; background:#000; }

.overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px;
    background:rgba(0,0,0,0.65); z-index:10; text-align:center; padding:20px;
}
.overlay.hidden { display:none; }
.spinner {
    width:42px; height:42px; border-radius:50%;
    border:3px solid rgba(255,255,255,0.1); border-top-color:var(--accent-2);
    animation:spin 0.8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.overlay .msg { font-size:14px; color:var(--muted); max-width:420px; }
.overlay .msg.error { color:var(--danger); }

/* ---------- Stats ---------- */
.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; }
.stat {
    background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:14px 16px;
}
.stat .k { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
.stat .v { font-size:16px; font-weight:700; margin-top:4px; color:var(--accent-2); }

/* ---------- Debug ---------- */
#debugPanel { display:none; margin-top:22px; }
#debugPanel.show { display:block; }
#debug {
    background:rgba(0,0,0,0.5); border:1px solid var(--border); border-radius:12px;
    padding:14px; max-height:220px; overflow-y:auto;
    font-family:"Cascadia Code", Consolas, monospace; font-size:11.5px; line-height:1.6;
}
#debug .err { color:var(--danger); }
#debug .warn { color:#fbbf24; }
#debug .info { color:#7dd3fc; }

footer { text-align:center; color:var(--muted); font-size:12px; margin-top:34px; }
</style>
</head>
<body>

<header>
    <div class="brand">
        <div class="logo">▶</div>
        <div>
            <h1>PW Live Player</h1>
            <small>HLS Proxy Streaming</small>
        </div>
    </div>
    <div class="status-pill" id="statusPill">
        <span class="dot"></span>
        <span id="statusText">Idle</span>
    </div>
</header>

<main>
    <!-- ===== Config ===== -->
    <div class="card">
        <h2>Stream Configuration</h2>
        <div class="field">
            <label>Stream URL (index.m3u8)</label>
            <input type="text" id="streamUrl" placeholder="https://...index.m3u8?Signature=...">
        </div>
        <div class="row">
            <div class="field">
                <label>Proxy Base (khali = same origin auto-detect)</label>
                <input type="text" id="proxyBase" placeholder="https://pw-live-proxy.onrender.com">
            </div>
        </div>
        <div class="actions">
            <button class="btn btn-primary" id="btnPlay">▶ Play Stream</button>
            <button class="btn btn-ghost" id="btnStop">■ Stop</button>
            <button class="btn btn-ghost" id="btnDebug">🐞 Debug Logs</button>
        </div>
    </div>

    <!-- ===== Player ===== -->
    <div class="card player-card">
        <div class="player-topbar">
            <div style="display:flex; align-items:center; gap:14px;">
                <div class="live-badge" id="liveBadge">
                    <div class="live-dot"></div>
                    <span class="live-text">LIVE</span>
                </div>
                <span class="player-title" id="playerTitle">No stream loaded</span>
            </div>
            <div class="player-controls-right">
                <select class="quality" id="qualitySelect" style="display:none;">
                    <option value="-1">Auto</option>
                </select>
            </div>
        </div>
        <div class="video-shell">
            <video id="video" controls playsinline></video>
            <div class="overlay hidden" id="overlay">
                <div class="spinner" id="overlaySpinner"></div>
                <div class="msg" id="overlayMsg"></div>
                <button class="btn btn-primary hidden" id="btnRetry" style="display:none;">↻ Retry</button>
            </div>
        </div>
    </div>

    <!-- ===== Stats ===== -->
    <div class="stats" id="stats" style="display:none;">
        <div class="stat"><div class="k">Quality</div><div class="v" id="statQuality">—</div></div>
        <div class="stat"><div class="k">Bitrate</div><div class="v" id="statBitrate">—</div></div>
        <div class="stat"><div class="k">Buffer</div><div class="v" id="statBuffer">—</div></div>
        <div class="stat"><div class="k">Latency</div><div class="v" id="statLatency">—</div></div>
    </div>

    <!-- ===== Debug ===== -->
    <div id="debugPanel">
        <div class="card">
            <h2>Debug Logs</h2>
            <div id="debug"></div>
        </div>
    </div>

    <footer>PW Live Proxy v2.0 — CORS-enabled HLS proxy player</footer>
</main>

<script>
(function() {
    "use strict";

    // ============ Elements ============
    const $ = (id) => document.getElementById(id);
    const video = $("video"), streamUrlEl = $("streamUrl"), proxyBaseEl = $("proxyBase");
    const overlay = $("overlay"), overlayMsg = $("overlayMsg"), overlaySpinner = $("overlaySpinner");
    const btnRetry = $("btnRetry"), btnPlay = $("btnPlay"), btnStop = $("btnStop"), btnDebug = $("btnDebug");
    const statusPill = $("statusPill"), statusText = $("statusText");
    const liveBadge = $("liveBadge"), playerTitle = $("playerTitle");
    const qualitySelect = $("qualitySelect"), stats = $("stats");
    const debugPanel = $("debugPanel"), debugEl = $("debug");

    let hls = null;
    let statsTimer = null;

    // ============ Saved config ============
    streamUrlEl.value = localStorage.getItem("pw_stream_url") || "";
    proxyBaseEl.value = localStorage.getItem("pw_proxy_base") || "";

    // ============ Logging ============
    function log(msg, type) {
        console.log("[player]", msg);
        const line = document.createElement("div");
        if (type) line.className = type;
        line.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
        debugEl.appendChild(line);
        debugEl.scrollTop = debugEl.scrollHeight;
    }

    // ============ UI helpers ============
    function setStatus(state, text) {
        statusPill.className = "status-pill" + (state ? " " + state : "");
        statusText.textContent = text;
    }
    function showOverlay(msg, isError) {
        overlay.classList.remove("hidden");
        overlayMsg.textContent = msg;
        overlayMsg.className = "msg" + (isError ? " error" : "");
        overlaySpinner.style.display = isError ? "none" : "block";
        btnRetry.style.display = isError ? "inline-flex" : "none";
    }
    function hideOverlay() { overlay.classList.add("hidden"); }
    function fail(msg) {
        showOverlay("✕ " + msg, true);
        setStatus("error", "Error");
        log(msg, "err");
    }

    // ============ Proxy URL builder ============
    function buildProxiedUrl(original) {
        let base = proxyBaseEl.value.trim().replace(/\/+$/, "");
        if (!base) base = window.location.origin; // same origin auto-detect
        return base + "/api/stream?url=" + encodeURIComponent(original);
    }

    // ============ Player ============
    function destroyPlayer() {
        if (hls) { hls.destroy(); hls = null; }
        video.removeAttribute("src");
        video.load();
        if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
        stats.style.display = "none";
        qualitySelect.style.display = "none";
        liveBadge.classList.remove("show");
    }

    function startStats() {
        stats.style.display = "grid";
        if (statsTimer) clearInterval(statsTimer);
        statsTimer = setInterval(() => {
            try {
                // Buffer
                let buf = 0;
                if (video.buffered.length) {
                    buf = Math.max(0, video.buffered.end(video.buffered.length - 1) - video.currentTime);
                }
                $("statBuffer").textContent = buf.toFixed(1) + "s";

                if (hls) {
                    const lvl = hls.levels && hls.levels[hls.currentLevel];
                    $("statQuality").textContent = lvl ? (lvl.height ? lvl.height + "p" : "Auto") : "—";
                    $("statBitrate").textContent = lvl ? (lvl.bitrate / 1000).toFixed(0) + " kbps" : "—";
                    const lat = hls.latency != null ? hls.latency : null;
                    $("statLatency").textContent = lat != null ? lat.toFixed(1) + "s" : "—";
                } else if (video.videoHeight) {
                    $("statQuality").textContent = video.videoHeight + "p";
                }
            } catch (e) { /* ignore */ }
        }, 1000);
    }

    function populateQualities() {
        qualitySelect.innerHTML = '<option value="-1">Auto</option>';
        if (!hls || !hls.levels) return;
        hls.levels.forEach((lvl, i) => {
            const opt = document.createElement("option");
            opt.value = i;
            opt.textContent = (lvl.height ? lvl.height + "p" : "Level " + i) +
                " — " + Math.round(lvl.bitrate / 1000) + " kbps";
            qualitySelect.appendChild(opt);
        });
        qualitySelect.style.display = "inline-block";
    }

    qualitySelect.addEventListener("change", () => {
        if (hls) {
            hls.currentLevel = parseInt(qualitySelect.value, 10);
            log("Quality → " + qualitySelect.options[qualitySelect.selectedIndex].text, "info");
        }
    });

    function play() {
        const original = streamUrlEl.value.trim();
        if (!original) {
            fail("Stream URL daalo pehle (index.m3u8 link).");
            return;
        }
        if (!/^https?:\/\//i.test(original)) {
            fail("URL invalid lag raha hai — https:// se shuru hona chahiye.");
            return;
        }

        localStorage.setItem("pw_stream_url", original);
        localStorage.setItem("pw_proxy_base", proxyBaseEl.value.trim());

        destroyPlayer();
        const url = buildProxiedUrl(original);

        showOverlay("Stream load ho raha hai...", false);
        setStatus("", "Connecting…");
        playerTitle.textContent = new URL(original).hostname;
        log("Proxy URL: " + url.slice(0, 110) + "…", "info");

        if (typeof Hls === "undefined") {
            fail("hls.js load nahi hua — internet check karo.");
            return;
        }

        if (Hls.isSupported()) {
            log("hls.js v" + Hls.version + " (MSE mode)", "info");
            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 90,
                manifestLoadingMaxRetry: 3,
                levelLoadingMaxRetry: 4,
                fragLoadingMaxRetry: 6,
                manifestLoadingRetryDelay: 1000,
                levelLoadingRetryDelay: 1000,
                fragLoadingRetryDelay: 1000,
            });

            hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
                log("Manifest parsed | levels: " + (data.levels ? data.levels.length : 0), "info");
                populateQualities();
                tryPlay();
            });

            hls.on(Hls.Events.LEVEL_SWITCHED, (_, data) => {
                const lvl = hls.levels[data.level];
                if (lvl && lvl.height) log("Quality: " + lvl.height + "p", "info");
            });

            hls.on(Hls.Events.ERROR, (_, data) => {
                const msg = data.type + " / " + data.details + (data.fatal ? " [FATAL]" : "");
                log(msg, data.fatal ? "err" : "warn");

                if (!data.fatal) return;

                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    if (data.details === "manifestLoadError" || data.details === "manifestLoadTimeOut") {
                        fail("Manifest load fail — URL expire ho gaya ya proxy down hai. Naya URL daalo ya Retry dabao.");
                    } else {
                        log("Network error — restarting load…", "warn");
                        hls.startLoad();
                    }
                } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                    log("Media error — recovering…", "warn");
                    hls.recoverMediaError();
                } else {
                    fail("Fatal error: " + data.details);
                }
            });

            hls.loadSource(url);
            hls.attachMedia(video);

        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
            log("Native HLS (Safari)", "info");
            video.src = url;
            video.addEventListener("loadedmetadata", tryPlay, { once: true });
        } else {
            fail("Is browser mein HLS support nahi hai.");
        }
    }

    function tryPlay() {
        video.muted = true; // autoplay ke liye muted start
        const p = video.play();
        if (p && p.catch) {
            p.then(() => log("Autoplay OK (muted)", "info"))
             .catch((e) => {
                 log("Autoplay blocked: " + e.message + " — controls se play karo", "warn");
                 hideOverlay();
             });
        }
    }

    // ============ Video events ============
    video.addEventListener("playing", () => {
        hideOverlay();
        setStatus("online", "Streaming");
        liveBadge.classList.add("show");
        startStats();
        log("Playback started ▶", "info");
    });
    video.addEventListener("waiting", () => { log("Buffering…", "warn"); });
    video.addEventListener("error", () => {
        const err = video.error;
        if (!err || !video.getAttribute("src")) return;
        const codes = { 1: "ABORTED", 2: "NETWORK", 3: "DECODE", 4: "SRC_NOT_SUPPORTED" };
        fail("Video error (" + (codes[err.code] || err.code) + ")");
    });

    // ============ Buttons ============
    btnPlay.addEventListener("click", play);
    btnRetry.addEventListener("click", play);
    btnStop.addEventListener("click", () => {
        destroyPlayer();
        hideOverlay();
        setStatus("", "Idle");
        playerTitle.textContent = "No stream loaded";
        log("Stopped", "info");
    });
    btnDebug.addEventListener("click", () => {
        debugPanel.classList.toggle("show");
    });

    setStatus("", "Idle");
    log("Player ready. Stream URL daalo aur Play dabao.", "info");
})();
</script>
</body>
</html>
