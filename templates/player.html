<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Live Player</title>
<!-- "@latest" ek din bina warning ke breaking major version khinch sakta hai
     aur pure script ko silently crash kar sakta hai (isliye design/live-badge/
     go-live kuchh bhi nahi dikhta tha — poora IIFE Hls.isSupported() pe hi
     ReferenceError khaake ruk jaata tha). Ek tested, stable version pin kiya. -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"
        onerror="window.__hlsLoadFailed = true;"></script>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #2c2c2e;
    overflow: hidden;
    /* Mobile browsers (Chrome/Safari) ka address-bar show/hide hone se
       "100%"/"100vh" viewport se bada ho jaata hai, isliye video pura fit
       nahi hota tha portrait me. --vh JS se real visible height set karta
       hai; dvh un browsers ke liye jo already isko samajhte hain. */
    height: calc(var(--vh, 1vh) * 100);
    height: 100dvh;
}

.player-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2c2c2e;
}

#video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #2c2c2e;
}

/* Simple Live Badge */
.live-badge {
    position: absolute;
    top: 16px;
    left: 16px;
    display: none;
    align-items: center;
    gap: 8px;
    background: rgba(0, 0, 0, 0.7);
    padding: 5px 12px 5px 10px;
    border-radius: 4px;
    z-index: 10;
    pointer-events: none;
    border-left: 3px solid #ff2d2d;
}
.live-badge.show { display: flex; }

.live-dot {
    width: 8px;
    height: 8px;
    background: #ff2d2d;
    border-radius: 50%;
    animation: blink 1s ease-in-out infinite;
}

.live-text {
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
}

/* Go Live — right side, always visible while the stream is live.
   Red = you're behind the live edge, tap to jump to live.
   Grey = you're already watching live. */
.go-live-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 10;
    display: none;
    align-items: center;
    gap: 6px;
    background: #ff2d2d;
    color: #fff;
    border: none;
    padding: 7px 14px;
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
}
.go-live-btn.show { display: flex; }
.go-live-btn.at-live {
    background: rgba(255, 255, 255, 0.18);
    color: rgba(255, 255, 255, 0.7);
}

/* Loading */
.loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255, 255, 255, 0.3);
    font-size: 13px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    z-index: 1;
    text-align: center;
}

.spinner {
    width: 32px;
    height: 32px;
    margin: 0 auto 12px;
    border: 2px solid rgba(255, 255, 255, 0.06);
    border-top: 2px solid rgba(255, 255, 255, 0.25);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="player-wrapper">
    <div class="loading" id="loading">
        <div class="spinner"></div>
        Loading...
    </div>

    <div class="live-badge" id="liveBadge">
        <div class="live-dot"></div>
        <span class="live-text">LIVE</span>
    </div>

    <button class="go-live-btn" id="goLiveBtn">⏵ Go Live</button>

    <video id="video" controls autoplay playsinline></video>
</div>

<script>
(function() {
    const video = document.getElementById('video');
    const loading = document.getElementById('loading');
    const liveBadge = document.getElementById('liveBadge');
    const goLiveBtn = document.getElementById('goLiveBtn');

    // ── Real viewport height (mobile address-bar fix) ────────────────────
    // html/body ka CSS "100dvh" fallback bhi rakhta hai, lekin purane
    // Chrome/WebView jo dvh nahi samajhte unke liye yahi asli fix hai.
    function setRealVh() {
        document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
    }
    setRealVh();
    window.addEventListener('resize', setRealVh);
    window.addEventListener('orientationchange', setRealVh);

    const rawUrl = new URLSearchParams(window.location.search).get('url');

    function showError(msg) {
        loading.innerHTML = '✕ ' + msg;
        loading.style.color = 'rgba(255, 45, 45, 0.6)';
        const spinner = document.querySelector('.spinner');
        if (spinner) spinner.style.display = 'none';
    }

    if (!rawUrl) {
        showError('URL missing — ?url=&lt;index.m3u8&gt; lagakar aao.');
        return;
    }

    // Same-origin proxy — real CDN URL never reaches the browser.
    const url = '/api/pwlive/player?url=' + encodeURIComponent(rawUrl);

    let hls = null;
    let isLive = false;

    video.addEventListener('canplay', function() {
        loading.style.display = 'none';
    });

    video.addEventListener('error', function() {
        showError('Failed to load');
    });

    // ── Go Live — always visible while live. Red = behind the live edge
    // (tap to jump to live). Grey = already watching live. ──────────────
    function checkLiveEdge() {
        if (!isLive || video.seekable.length === 0) return;
        const edge = video.seekable.end(video.seekable.length - 1);
        const behind = edge - video.currentTime;
        goLiveBtn.classList.toggle('at-live', behind <= 15);
    }

    goLiveBtn.addEventListener('click', function() {
        if (video.seekable.length === 0) return;
        video.currentTime = video.seekable.end(video.seekable.length - 1);
        video.play().catch(function() {});
    });

    // ── Fullscreen bracket [] tap → force landscape orientation ─────────
    function lockLandscape() {
        var lockable = screen.orientation && screen.orientation.lock;
        if (lockable) {
            screen.orientation.lock('landscape').catch(function() {});
        }
    }
    function unlockOrientation() {
        if (screen.orientation && screen.orientation.unlock) {
            screen.orientation.unlock();
        }
    }
    function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }
    document.addEventListener('fullscreenchange', function() {
        if (isFullscreen()) lockLandscape(); else unlockOrientation();
    });
    document.addEventListener('webkitfullscreenchange', function() {
        if (isFullscreen()) lockLandscape(); else unlockOrientation();
    });
    // iOS Safari — native <video> fullscreen doesn't fire the events above.
    video.addEventListener('webkitbeginfullscreen', lockLandscape);
    video.addEventListener('webkitendfullscreen', unlockOrientation);

    video.addEventListener('timeupdate', checkLiveEdge);
    video.addEventListener('seeked', checkLiveEdge);

    // window.__hlsLoadFailed is set by the <script onerror> above if the
    // jsdelivr CDN request itself failed (network block etc). Checking
    // `typeof Hls === 'undefined'` too covers any other silent load
    // failure. Earlier this whole block wasn't guarded, so ANY failure
    // here (Hls missing, a bad config option, etc.) threw uncaught and
    // killed the rest of the script — that's exactly why the live badge,
    // go-live button, and our loading/error UI never showed up: only the
    // bare native <video controls> element was left on screen.
    try {
        if (window.__hlsLoadFailed || typeof Hls === 'undefined') {
            throw new Error('hls-lib-unavailable');
        }

        if (Hls.isSupported()) {
            hls = new Hls({
                liveDurationInfinity: true,
                enableWorker: true
            });

            hls.loadSource(url);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(function() {});
            });

            hls.on(Hls.Events.LEVEL_LOADED, function(_evt, data) {
                isLive = !!(data && data.details && data.details.live);
                liveBadge.classList.toggle('show', isLive);
                goLiveBtn.classList.toggle('show', isLive);
                checkLiveEdge();
            });

            hls.on(Hls.Events.ERROR, function(_, data) {
                if (data.fatal) {
                    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                        hls.startLoad();
                    } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                        hls.recoverMediaError();
                    } else {
                        showError('Stream error — refresh the page.');
                    }
                }
            });

        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            isLive = true; // Safari native HLS doesn't expose this easily; assume live.
            liveBadge.classList.add('show');
            goLiveBtn.classList.add('show');
            video.addEventListener('loadedmetadata', function() {
                video.play().catch(function() {});
            });
        } else {
            showError('HLS not supported');
        }
    } catch (e) {
        if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // hls.js load failed but native HLS is available (Safari) —
            // fall back instead of leaving the player fully broken.
            video.src = url;
            isLive = true;
            liveBadge.classList.add('show');
            goLiveBtn.classList.add('show');
            video.addEventListener('loadedmetadata', function() {
                video.play().catch(function() {});
            });
        } else {
            showError('Player library failed to load — check connection & refresh.');
        }
    }
})();
</script>

</body>
</html>
