<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PW LIVE PLAYER</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
:root {
    --bg:#0b0f1a; --card:rgba(255,255,255,.05); --border:rgba(255,255,255,.1);
    --accent:#6c5ce7; --accent2:#00d2ff; --text:#e5e7eb; --muted:#9ca3af;
    --danger:#ff5470; --ok:#2dd4a7;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    background:radial-gradient(900px 500px at 20% -10%, rgba(108,92,231,.22), transparent 60%),
               radial-gradient(800px 400px at 110% 0%, rgba(0,210,255,.13), transparent 60%),
               var(--bg);
    color:var(--text); min-height:100vh;
    display:flex; flex-direction:column;
}

/* ── Header ── */
header {
    padding:16px 24px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border);
    background:rgba(11,15,26,.75); backdrop-filter:blur(12px);
    position:sticky; top:0; z-index:50;
}
.brand { display:flex; align-items:center; gap:12px; }
.logo {
    width:36px; height:36px; border-radius:10px; flex-shrink:0;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    display:flex; align-items:center; justify-content:center; font-size:16px;
    box-shadow:0 4px 16px rgba(108,92,231,.45);
}
.brand h1 { font-size:17px; font-weight:700; letter-spacing:.5px; }
.brand small { display:block; font-size:11px; color:var(--muted); font-weight:400; }

.live-badge { display:none; align-items:center; gap:7px; padding:5px 13px; border-radius:999px;
    background:rgba(255,45,45,.12); border:1px solid rgba(255,45,45,.4); }
.live-badge.show { display:flex; }
.live-dot { width:8px; height:8px; background:#ff2d2d; border-radius:50%; animation:blink 1s infinite; box-shadow:0 0 8px #ff2d2d; }
@keyframes blink { 50% { opacity:.25; } }
.live-badge span { font-size:11px; font-weight:700; letter-spacing:1px; color:#ff5c5c; }

/* ── Main ── */
main { flex:1; display:flex; flex-direction:column; align-items:center; padding:22px 16px 40px; }
.class-title { font-size:15px; color:var(--muted); margin-bottom:14px; text-align:center;
    max-width:900px; word-break:break-word; }

/* ── Player shell ── */
.shell {
    position:relative; width:100%; max-width:960px; aspect-ratio:16/9;
    background:#000; border-radius:16px; overflow:hidden;
    border:1px solid var(--border); box-shadow:0 20px 60px rgba(0,0,0,.5);
}
#video { width:100%; height:100%; object-fit:contain; background:#000; display:block; cursor:pointer; }

/* Fullscreen: browser fullscreen element ko poori screen bhar do (landscape lock JS se handle hota hai) */
.shell:fullscreen { max-width:none; width:100vw; height:100vh; aspect-ratio:auto; border-radius:0; }
.shell:fullscreen #video { object-fit:contain; }

/* ── Moving promo watermark ── */
.promo-watermark {
    position:absolute; top:20px; left:20px; z-index:12; pointer-events:none; user-select:none;
    color:rgba(255,255,255,.42); font-weight:700; font-size:clamp(12px, 2.6vw, 17px);
    letter-spacing:1px; transform:rotate(45deg); white-space:nowrap;
    text-shadow:0 1px 3px rgba(0,0,0,.4); will-change:top,left;
}

/* ── Overlay (loading / ended / error) ── */
.overlay {
    position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; text-align:center;
    background:rgba(5,8,15,.85); padding:24px;
}
.overlay.hidden { display:none; }
.spinner { width:44px; height:44px; border-radius:50%;
    border:3px solid rgba(255,255,255,.1); border-top-color:var(--accent2);
    animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.overlay .msg { font-size:14px; color:var(--muted); max-width:420px; }
.overlay .msg.error { color:var(--danger); }

.ended-title { font-size:22px; font-weight:700; }
.ended-sub { font-size:13px; color:var(--muted); }
.action-row { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
.big-btn {
    display:inline-flex; align-items:center; gap:9px; padding:14px 28px;
    border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer;
    text-decoration:none; color:#fff; transition:transform .15s, box-shadow .2s;
}
.big-btn:active { transform:scale(.96); }
.big-btn.watch { background:linear-gradient(135deg, var(--accent), #8e7bff); box-shadow:0 6px 22px rgba(108,92,231,.45); }
.big-btn.download { background:linear-gradient(135deg, #0088cc, #00c2ff); box-shadow:0 6px 22px rgba(0,150,220,.45); }
.big-btn.retry { background:linear-gradient(135deg, #6b7280, #9ca3af); box-shadow:0 6px 22px rgba(107,114,128,.35); }

/* ── Custom control bar ── */
.controls {
    position:absolute; left:0; right:0; bottom:0; z-index:15;
    display:flex; flex-direction:column; gap:6px; padding:10px 14px 12px;
    background:linear-gradient(transparent, rgba(0,0,0,.8));
    opacity:0; transition:opacity .25s;
}
.shell:hover .controls, .controls.force-show { opacity:1; }

.seek-row { display:flex; align-items:center; gap:10px; }
.time-label { font-size:11.5px; color:#d1d5db; min-width:38px; text-align:left; flex-shrink:0; font-variant-numeric:tabular-nums; }
.progress-wrap { flex:1; height:6px; background:rgba(255,255,255,.18); border-radius:99px; cursor:pointer; position:relative; touch-action:none; }
.progress-wrap::before {
    /* Bada invisible hit-area, chhoti bar pe bhi easily drag/tap ho sake */
    content:""; position:absolute; top:-10px; bottom:-10px; left:0; right:0;
}
.progress-bar { height:100%; background:linear-gradient(90deg, var(--accent), var(--accent2)); border-radius:99px; width:0%; pointer-events:none; }

.go-live {
    flex-shrink:0; padding:0 14px; height:30px; border:none; border-radius:8px;
    background:rgba(255,45,45,.9); color:#fff; font-size:11.5px; font-weight:700;
    letter-spacing:.5px; cursor:pointer; display:flex; align-items:center; gap:6px;
    transition:background .2s, box-shadow .2s;
}
.go-live:hover { background:#ff2d2d; }
.go-live.at-live { background:rgba(255,255,255,.14); cursor:default; box-shadow:none; }
.go-live.hidden-live { display:none; }
.go-live .gdot { width:7px; height:7px; border-radius:50%; background:#fff; }
.go-live.at-live .gdot { animation:none; }
.go-live:not(.at-live) .gdot { animation:blink 1s infinite; }

.btn-row { display:flex; align-items:center; justify-content:flex-end; }
.cbtn {
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2);
    color:#fff; border-radius:8px; width:36px; height:32px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:15px;
    flex-shrink:0; transition:background .2s;
}
.cbtn:hover { background:rgba(255,255,255,.25); }

footer { text-align:center; color:var(--muted); font-size:11.5px; padding:14px; }
</style>
</head>
<body>

<header>
    <div class="brand">
        <div class="logo">▶</div>
        <div>
            <h1>PW LIVE PLAYER</h1>
            <small>Quality Education 💎</small>
        </div>
    </div>
    <div class="live-badge" id="liveBadge">
        <div class="live-dot"></div><span>LIVE</span>
    </div>
</header>

<main>
    <div class="class-title" id="classTitle">{{ name }}</div>

    <div class="shell" id="shell">
        <video id="video" playsinline></video>

        <!-- Moving promo watermark — live + recorded dono me chalta hai -->
        <div class="promo-watermark" id="promoWatermark">@PW_SENSEI</div>

        <!-- Custom controls -->
        <div class="controls" id="controls">
            <div class="seek-row">
                <span class="time-label" id="timeLabel">00:00</span>
                <div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
                <button class="go-live" id="btnGoLive"><span class="gdot"></span>LIVE</button>
            </div>
            <div class="btn-row">
                <button class="cbtn" id="btnFullscreen" title="Fullscreen">⛶</button>
            </div>
        </div>

        <!-- Overlay -->
        <div class="overlay" id="overlay">
            <div class="spinner" id="spinner"></div>
            <div class="msg" id="overlayMsg">Live class load ho rahi hai…</div>
            <div id="endedBox" style="display:none; flex-direction:column; align-items:center; gap:10px;">
                <div class="ended-title" id="endedTitle">📺 Class Recorded</div>
                <div class="ended-sub" id="endedSub">Live khatam ho gayi — ab aap recording dekh ya download kar sakte ho.</div>
                <div class="action-row" id="endedActions">
                    <button class="big-btn watch" id="btnWatch">▶ Watch Online</button>
                    <a class="big-btn download" id="btnDownload" href="#" target="_blank" rel="noopener">⬇ Download Now</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer>Powered By SmartyMS & Team Toxic ❤️‍🩹</footer>

<script>
(function () {
    "use strict";

    var NAME = {{ name|tojson }};
    var INITIAL_STATUS = {{ status|tojson }};

    var video = document.getElementById("video");
    var shell = document.getElementById("shell");
    var overlay = document.getElementById("overlay");
    var overlayMsg = document.getElementById("overlayMsg");
    var spinner = document.getElementById("spinner");
    var endedBox = document.getElementById("endedBox");
    var endedTitle = document.getElementById("endedTitle");
    var endedSub = document.getElementById("endedSub");
    var endedActions = document.getElementById("endedActions");
    var btnWatch = document.getElementById("btnWatch");
    var btnDownload = document.getElementById("btnDownload");
    var liveBadge = document.getElementById("liveBadge");
    var btnFullscreen = document.getElementById("btnFullscreen");
    var btnGoLive = document.getElementById("btnGoLive");
    var progressBar = document.getElementById("progressBar");
    var progressWrap = document.getElementById("progressWrap");
    var timeLabel = document.getElementById("timeLabel");

    var hls = null;
    var isLive = true;
    var statusPoller = null;

    // Tracks whether playback has EVER actually started for this stream.
    var manifestEverLoaded = false;
    var loadWatchdog = null;
    var LOAD_WATCHDOG_MS = 20000;

    function clearLoadWatchdog() {
        if (loadWatchdog) { clearTimeout(loadWatchdog); loadWatchdog = null; }
    }
    function armLoadWatchdog() {
        clearLoadWatchdog();
        loadWatchdog = setTimeout(function () {
            if (!manifestEverLoaded) {
                showError("Stream start nahi ho pa raha — link expire ho gaya ya server slow hai. Thodi der baad refresh karo.");
            }
        }, LOAD_WATCHDOG_MS);
    }

    // ─────────── Overlay helpers ───────────
    function showLoading(msg) {
        overlay.classList.remove("hidden");
        spinner.style.display = "block";
        endedBox.style.display = "none";
        overlayMsg.style.display = "block";
        overlayMsg.textContent = msg;
        overlayMsg.className = "msg";
    }
    function showError(msg) {
        overlay.classList.remove("hidden");
        spinner.style.display = "none";
        endedBox.style.display = "none";
        overlayMsg.style.display = "block";
        overlayMsg.textContent = "✕ " + msg;
        overlayMsg.className = "msg error";
    }
    function hideOverlay() { overlay.classList.add("hidden"); }

    function showEnded(st) {
        overlay.classList.remove("hidden");
        spinner.style.display = "none";
        overlayMsg.style.display = "none";
        endedBox.style.display = "flex";
        endedTitle.textContent = "📺 Class Recorded";
        endedActions.style.display = "flex";
        btnWatch.style.display = "";

        if (st.download_url) {
            btnDownload.style.display = "";
            btnDownload.href = st.download_url;
            endedSub.textContent = "Live khatam ho gayi — ab aap recording dekh ya download kar sakte ho.";
        } else {
            btnDownload.style.display = "none";
            endedSub.textContent = "Live khatam ho gayi — Watch Online available hai. Download thodi der me ready hoga.";
        }

        btnWatch.onclick = function () {
            overlay.classList.add("hidden");
            liveBadge.classList.remove("show");
            isLive = false;
            btnGoLive.classList.add("hidden-live");
            if (hls) { hls.destroy(); hls = null; }
            video.src = st.watch_url;
            video.muted = false;
            video.play().catch(function () {});
        };
    }

    function messageForStatus(status) {
        switch (status) {
            case "RECORDING": return "Live abhi khatam hui hai — recording finalize ho rahi hai…";
            case "ENDING": return "Recording finalize ho rahi hai…";
            case "PROCESSING": return "480p video taiyar ho raha hai…";
            case "UPLOADING": return "Telegram pe upload ho raha hai…";
            default: return "Recording taiyar ho rahi hai…";
        }
    }

    function showFailed(st) {
        overlay.classList.remove("hidden");
        spinner.style.display = "none";
        endedBox.style.display = "none";
        overlayMsg.style.display = "block";
        overlayMsg.className = "msg error";
        overlayMsg.textContent = "✕ Processing fail ho gayi" + (st.error ? (": " + st.error) : "") + " — admin se contact karo.";
    }

    // ─────────── Status polling (live end detection + processing states) ───────────
    function startStatusPolling() {
        if (statusPoller) return;
        statusPoller = setInterval(function () {
            fetch("/api/status/" + encodeURIComponent(NAME))
                .then(function (r) { return r.json(); })
                .then(function (st) {
                    if (st.status === "READY" || st.status === "UPLOAD_FAILED") {
                        clearInterval(statusPoller);
                        statusPoller = null;
                        if (hls) { hls.destroy(); hls = null; }
                        showEnded(st);
                    } else if (st.status === "FAILED") {
                        clearInterval(statusPoller);
                        statusPoller = null;
                        if (hls) { hls.destroy(); hls = null; }
                        showFailed(st);
                    } else if (["RECORDING", "ENDING", "PROCESSING", "UPLOADING"].indexOf(st.status) !== -1) {
                        showLoading(messageForStatus(st.status));
                    }
                })
                .catch(function () {});
        }, 5000);
    }

    // ─────────── Live player ───────────
    var PLAYLIST_URL = "/api/live/" + encodeURIComponent(NAME) + "/playlist";

    function startLive() {
        showLoading("Live class load ho rahi hai…");

        if (typeof Hls === "undefined") {
            showError("Player load nahi hua — internet check karo.");
            return;
        }

        if (Hls.isSupported()) {
            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 90,
                liveSyncDurationCount: 3,
                manifestLoadingMaxRetry: 6,
                levelLoadingMaxRetry: 6,
                fragLoadingMaxRetry: 6,
                manifestLoadingRetryDelay: 1000,
                levelLoadingRetryDelay: 1000,
                fragLoadingRetryDelay: 1000,
            });

            hls.on(Hls.Events.MANIFEST_PARSED, function () {
                manifestEverLoaded = true;
                clearLoadWatchdog();
                video.muted = false; // default hamesha unmuted
                video.play().catch(function () {
                    video.muted = true; // autoplay policy fallback
                    video.play().catch(function () {});
                });
            });

            hls.on(Hls.Events.LEVEL_LOADED, function (_, data) {
                if (data.details && data.details.live === false) {
                    startStatusPolling();
                }
            });

            hls.on(Hls.Events.ERROR, function (_, data) {
                if (!data.fatal) return;

                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    var neverStarted =
                        data.details === "manifestLoadError" ||
                        data.details === "manifestLoadTimeOut" ||
                        data.details === "manifestParsingError";

                    if (!manifestEverLoaded && neverStarted) {
                        showError("Stream load nahi ho paya — link expire ho gaya ya server down hai. Thodi der baad refresh karo.");
                        return;
                    }
                    if (!manifestEverLoaded) return;

                    // Playback had already started once — a network error here
                    // near the live edge usually means the live class just ended.
                    startStatusPolling();
                    hls.startLoad();
                } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                    hls.recoverMediaError();
                } else {
                    showError("Stream error — thodi der baad page refresh karo.");
                }
            });

            armLoadWatchdog();
            hls.loadSource(PLAYLIST_URL);
            hls.attachMedia(video);

        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
            video.src = PLAYLIST_URL; // Safari native HLS
            armLoadWatchdog();
            video.addEventListener("loadedmetadata", function () {
                manifestEverLoaded = true;
                clearLoadWatchdog();
                video.muted = false;
                video.play().catch(function () {});
            });
        } else {
            showError("Is browser mein HLS support nahi hai.");
        }
    }

    // ─────────── Video events ───────────
    video.addEventListener("playing", function () {
        if (isLive) {
            hideOverlay();
            liveBadge.classList.add("show");
        }
    });
    video.addEventListener("error", function () {
        if (video.getAttribute("src")) showError("Video error — refresh karke try karo.");
    });

    // Live class ki speed hamesha 1x.
    video.addEventListener("ratechange", function () {
        if (isLive && video.playbackRate !== 1) video.playbackRate = 1;
    });

    // ─────────── Tap-to-toggle play/pause (dedicated pause button hataya —
    // ab professional players jaisa: video pe single tap = pause/play) ───
    video.addEventListener("click", function () {
        if (video.paused) video.play(); else video.pause();
    });

    // Video hamesha unmuted start hota hai (dedicated mute button hataya —
    // volume control device ka apna hi use karega).
    video.muted = false;

    // ─────────── Fullscreen → force landscape orientation ───────────
    function lockLandscape() {
        if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock("landscape").catch(function () {});
        }
    }
    function unlockOrientation() {
        if (screen.orientation && screen.orientation.unlock) {
            try { screen.orientation.unlock(); } catch (e) {}
        }
    }
    btnFullscreen.addEventListener("click", function () {
        if (document.fullscreenElement) {
            document.exitFullscreen();
        } else if (shell.requestFullscreen) {
            shell.requestFullscreen().then(lockLandscape).catch(function () {});
        } else if (video.webkitEnterFullscreen) {
            video.webkitEnterFullscreen(); // iOS Safari
        }
    });
    document.addEventListener("fullscreenchange", function () {
        if (!document.fullscreenElement) unlockOrientation();
    });

    // ─────────── Go Live — DVR edge pe jump ───────────
    function updateGoLiveState() {
        if (!isLive) return;
        var atLive = false;
        if (hls && hls.liveSyncPosition) {
            atLive = Math.abs(video.currentTime - hls.liveSyncPosition) < 8;
        }
        btnGoLive.classList.toggle("at-live", atLive);
    }
    btnGoLive.addEventListener("click", function () {
        if (!isLive) return;
        var edge = null;
        if (hls && hls.liveSyncPosition) edge = hls.liveSyncPosition;
        else if (video.seekable.length) edge = video.seekable.end(video.seekable.length - 1);
        if (edge != null) {
            video.currentTime = edge;
            video.play().catch(function () {});
        }
    });

    // ─────────── Progress bar — seekable DVR window (live) + full seek (recorded) ───────────
    function fmt(s) {
        s = Math.floor(s || 0);
        var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
        return (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
    }

    setInterval(function () {
        try {
            if (isLive) {
                if (video.seekable.length) {
                    var end = video.seekable.end(video.seekable.length - 1);
                    var start = video.seekable.start(0);
                    var pct = end > start ? ((video.currentTime - start) / (end - start)) * 100 : 0;
                    progressBar.style.width = Math.min(100, Math.max(0, pct)) + "%";
                }
                timeLabel.textContent = fmt(video.currentTime);
                updateGoLiveState();
            } else if (video.duration) {
                progressBar.style.width = (video.currentTime / video.duration) * 100 + "%";
                timeLabel.textContent = fmt(video.currentTime);
            }
        } catch (e) {}
    }, 500);

    // Click ya drag dono se seek ho — live DVR window ke andar bhi, recorded
    // video me bhi. "Go Live" hamesha live edge pe direct jump ke liye hai.
    var seeking = false;
    function seekAtClientX(clientX) {
        var rect = progressWrap.getBoundingClientRect();
        var pct = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
        if (isLive) {
            if (video.seekable.length) {
                var start = video.seekable.start(0);
                var end = video.seekable.end(video.seekable.length - 1);
                video.currentTime = start + pct * (end - start);
            }
        } else if (video.duration) {
            video.currentTime = pct * video.duration;
        }
    }
    progressWrap.addEventListener("pointerdown", function (e) {
        seeking = true;
        seekAtClientX(e.clientX);
    });
    window.addEventListener("pointermove", function (e) {
        if (seeking) seekAtClientX(e.clientX);
    });
    window.addEventListener("pointerup", function () { seeking = false; });

    // ─────────── Moving promo watermark (DVD-bounce style diagonal) ───────────
    (function () {
        var el = document.getElementById("promoWatermark");
        var x = 16, y = 16, dx = 0.55, dy = 0.38;
        function step() {
            var maxX = Math.max(0, shell.clientWidth - el.offsetWidth);
            var maxY = Math.max(0, shell.clientHeight - el.offsetHeight);
            x += dx; y += dy;
            if (x <= 0 || x >= maxX) { dx *= -1; x = Math.min(maxX, Math.max(0, x)); }
            if (y <= 0 || y >= maxY) { dy *= -1; y = Math.min(maxY, Math.max(0, y)); }
            el.style.left = x + "px";
            el.style.top = y + "px";
            requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    })();

    // ─────────── Boot ───────────
    var TERMINAL_STATUSES = ["READY", "UPLOAD_FAILED", "FAILED"];
    var PROCESSING_STATUSES = ["RECORDING", "ENDING", "PROCESSING", "UPLOADING"];

    if (TERMINAL_STATUSES.indexOf(INITIAL_STATUS) !== -1) {
        fetch("/api/status/" + encodeURIComponent(NAME))
            .then(function (r) { return r.json(); })
            .then(function (st) {
                if (st.status === "READY" || st.status === "UPLOAD_FAILED") showEnded(st);
                else if (st.status === "FAILED") showFailed(st);
                else if (PROCESSING_STATUSES.indexOf(st.status) !== -1) {
                    showLoading(messageForStatus(st.status));
                    startStatusPolling();
                } else startLive();
            })
            .catch(function () { startLive(); });
    } else if (PROCESSING_STATUSES.indexOf(INITIAL_STATUS) !== -1) {
        // Live already khatam ho chuki hai, pipeline chal rahi hai — is
        // waqt source URL par HLS play karne ki koshish mat karo (voh
        // expire ho chuka ho sakta hai), seedha processing status poll karo.
        showLoading(messageForStatus(INITIAL_STATUS));
        startStatusPolling();
    } else {
        startLive();
    }
})();
</script>
</body>
</html>
