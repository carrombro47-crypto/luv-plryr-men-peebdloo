<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Live Player</title>
<!-- "@latest" ek din bina warning ke breaking major version khinch sakta
     hai aur pura script silently crash kar sakta hai (isse pehle exactly
     yehi hua tha — design/live-badge/go-live kuchh bhi nahi dikhta tha,
     kyunki poora IIFE Hls.isSupported() pe hi ReferenceError khaake ruk
     jaata tha). Ek tested, stable version yahan pin ki gayi hai. -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"
        onerror="window.__hlsLoadFailed = true;"></script>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    /* Ek jagah se poore player ka theme control hota hai — Live Player,
       Download Player, aur watch page teeno isi ek variable set ko use
       karte hain, isliye background hamesha consistent rehta hai. */
    --bg: #dceaf7;          /* light blue */
    --bg-video: #c9def2;    /* thoda darker light-blue letterbox bg */
    --text-dim: rgba(15, 30, 50, 0.45);
    --text-dim-strong: rgba(15, 30, 50, 0.65);
    --spinner-track: rgba(15, 30, 50, 0.10);
    --spinner-head: rgba(15, 30, 50, 0.35);
}

html, body {
    width: 100%;
    background: var(--bg);
    overflow: hidden;
    /* Mobile browsers (Chrome/Safari) ka address-bar show/hide hone se
       plain "100%"/"100vh" viewport se bada calculate ho jaata hai, isliye
       video/live-badge/go-live-button pura fit nahi hote the portrait me.
       --vh JS se real visible height set karta hai (neeche script me);
       100dvh un browsers ke liye jo pehle se hi ise samajhte hain. */
    height: calc(var(--vh, 1vh) * 100);
    height: 100dvh;
}

.player-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
}

#video {
    width: 100%;
    height: 100%;
    object-fit: contain; /* fit-to-screen — poora video letterbox ke saath dikhta hai, crop nahi hota */
    background: var(--bg-video);
}

/* Simple Live Badge — top-left */
.live-badge {
    position: absolute;
    top: 16px;
    left: 16px;
    display: none;
    align-items: center;
    gap: 8px;
    background: rgba(20, 20, 22, 0.78);
    padding: 5px 12px 5px 10px;
    border-radius: 4px;
    z-index: 10;
    pointer-events: none;
    border-left: 3px solid #ff2d2d;
}
.live-badge.show { display: flex; }

.live-dot {
    width: 8px;
    height: 8px;
    background: #ff2d2d;
    border-radius: 50%;
    animation: blink 1s ease-in-out infinite;
}

.live-text {
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
}

/* Go Live — top-right, always visible while the stream is live.
   Red = you're behind the live edge, tap to jump to live.
   Grey = you're already watching live. */
.go-live-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 10;
    display: none;
    align-items: center;
    gap: 6px;
    background: #ff2d2d;
    color: #fff;
    border: none;
    padding: 7px 14px;
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
}
.go-live-btn.show { display: flex; }
.go-live-btn.at-live {
    background: rgba(20, 20, 22, 0.18);
    color: rgba(20, 20, 22, 0.6);
}

/* Loading — dark-on-light now (background light grey hai) */
.loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--text-dim);
    font-size: 13px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    z-index: 1;
    text-align: center;
}

.spinner {
    width: 32px;
    height: 32px;
    margin: 0 auto 12px;
    border: 2px solid var(--spinner-track);
    border-top: 2px solid var(--spinner-head);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* Small mode chip — sirf debug/clarity ke liye, batata hai kaunsa source
   use ho raha hai (Live Player = proxied, Download Player = direct CDN).
   Bottom-left, subtle, kabhi bhi playback ke beech me nahi aata. */
.mode-chip {
    position: absolute;
    bottom: 12px;
    left: 12px;
    z-index: 10;
    color: var(--text-dim-strong);
    background: rgba(255, 255, 255, 0.55);
    padding: 3px 9px;
    border-radius: 4px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    pointer-events: none;
}
</style>
</head>
<body>

<div class="player-wrapper">
    <div class="loading" id="loading">
        <div class="spinner"></div>
        Loading...
    </div>

    <div class="live-badge" id="liveBadge">
        <div class="live-dot"></div>
        <span class="live-text">LIVE</span>
    </div>

    <button class="go-live-btn" id="goLiveBtn">⏵ Go Live</button>

    <span class="mode-chip" id="modeChip"></span>

    <video id="video" controls autoplay playsinline></video>
</div>

<script>
(function() {
    const video = document.getElementById('video');
    const loading = document.getElementById('loading');
    const liveBadge = document.getElementById('liveBadge');
    const goLiveBtn = document.getElementById('goLiveBtn');
    const modeChip = document.getElementById('modeChip');

    // ── Real viewport height (mobile address-bar fit-to-screen fix) ──────
    // CSS ka "100dvh" fallback bhi rakha hai, lekin purane Chrome/WebView
    // jo dvh nahi samajhte unke liye yehi asli fix hai.
    function setRealVh() {
        document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
    }
    setRealVh();
    window.addEventListener('resize', setRealVh);
    window.addEventListener('orientationchange', setRealVh);

    // ── Robust raw query-string parsing (mirrors main.py's
    // _raw_query_param) ─────────────────────────────────────────────────
    // Our ?url=<m3u8> value is itself a full CDN URL with its OWN query
    // string (Signature/Key-Pair-Id/Policy/start — full of '&','=','~').
    // The backend already handles this correctly via _raw_query_param,
    // but this page was still using plain URLSearchParams() to read
    // window.location.search — which silently truncates at the FIRST
    // un-encoded '&' inside that nested URL. So pasting a raw (not
    // encodeURIComponent()'d) CDN link straight into the address bar —
    // e.g. /player?url=https://cdn/x.m3u8?Signature=A&Key-Pair-Id=B&Policy=C —
    // lost everything after "Signature=A" (crucially Key-Pair-Id and
    // Policy), and the CDN then rejected the now-incomplete signed
    // request. THIS was the actual "live play nahi ho raha" bug — not
    // CORS. Fix: read `url` from the RAW query string, taking everything
    // from its marker to the end (exactly like the backend does), instead
    // of letting URLSearchParams split on every '&' it finds.
    //
    // Convention: if you also want ?mode=download, put it BEFORE url —
    // e.g. /player?mode=download&url=<m3u8> — because an unencoded `url`
    // value (correctly) claims everything after it to the end of the
    // string.
    function rawQueryParam(name) {
        var qs = window.location.search.replace(/^\?/, '');
        var marker = name + '=';
        var idx = qs.indexOf(marker);
        while (idx !== -1 && idx !== 0 && qs[idx - 1] !== '&') {
            idx = qs.indexOf(marker, idx + 1);
        }
        if (idx === -1) return null;
        var tail = qs.slice(idx + marker.length);
        try {
            return decodeURIComponent(tail);
        } catch (e) {
            return tail; // already-plain text (no percent-encoding) — use as-is
        }
    }

    const modeMatch = window.location.search.match(/[?&]mode=([^&]*)/);
    const mode = ((modeMatch ? decodeURIComponent(modeMatch[1]) : '').toLowerCase() === 'download')
        ? 'download' : 'player';
    modeChip.textContent = mode === 'download' ? 'Download Player' : 'Live Player';

    const rawUrl = rawQueryParam('url');

    function showError(msg) {
        loading.innerHTML = '✕ ' + msg;
        loading.style.color = 'rgba(200, 40, 40, 0.8)';
        const spinner = document.querySelector('.spinner');
        if (spinner) spinner.style.display = 'none';
    }

    if (!rawUrl) {
        showError('URL missing — ?url=&lt;index.m3u8&gt; lagakar aao.');
        return;
    }

    // Same-origin proxy — chahe "player" mode ho ya "download" mode, yeh
    // request hamesha isi domain pe jaati hai (relative URL), isliye CORS
    // yahan kabhi issue nahi hota — sirf ek same-origin fetch hai.
    const apiPath = mode === 'download' ? '/api/pwlive/download' : '/api/pwlive/player';
    const url = apiPath + '?url=' + encodeURIComponent(rawUrl);

    let hls = null;
    let isLive = false;

    video.addEventListener('canplay', function() {
        loading.style.display = 'none';
    });

    video.addEventListener('error', function() {
        showError('Failed to load');
    });

    // ── Go Live — always visible while live. Red = behind the live edge
    // (tap to jump to live). Grey = already watching live. ──────────────
    function checkLiveEdge() {
        if (!isLive || video.seekable.length === 0) return;
        const edge = video.seekable.end(video.seekable.length - 1);
        const behind = edge - video.currentTime;
        goLiveBtn.classList.toggle('at-live', behind <= 15);
    }

    goLiveBtn.addEventListener('click', function() {
        if (video.seekable.length === 0) return;
        video.currentTime = video.seekable.end(video.seekable.length - 1);
        video.play().catch(function() {});
    });

    // ── Fullscreen bracket [] tap → force landscape orientation ─────────
    function lockLandscape() {
        var lockable = screen.orientation && screen.orientation.lock;
        if (lockable) {
            screen.orientation.lock('landscape').catch(function() {});
        }
    }
    function unlockOrientation() {
        if (screen.orientation && screen.orientation.unlock) {
            screen.orientation.unlock();
        }
    }
    function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }
    document.addEventListener('fullscreenchange', function() {
        if (isFullscreen()) lockLandscape(); else unlockOrientation();
    });
    document.addEventListener('webkitfullscreenchange', function() {
        if (isFullscreen()) lockLandscape(); else unlockOrientation();
    });
    // iOS Safari — native <video> fullscreen doesn't fire the events above.
    video.addEventListener('webkitbeginfullscreen', lockLandscape);
    video.addEventListener('webkitendfullscreen', unlockOrientation);

    video.addEventListener('timeupdate', checkLiveEdge);
    video.addEventListener('seeked', checkLiveEdge);

    // window.__hlsLoadFailed set hota hai <script onerror> se agar jsdelivr
    // CDN request hi fail ho gayi (network block waghera). typeof Hls ===
    // 'undefined' check koi bhi doosri silent load-failure cover karta hai.
    // Pehle yeh poora block unguarded tha, isliye YAHAN koi bhi failure
    // (Hls missing, bad config option) uncaught throw karke pure script ko
    // maar deti thi — isi wajah se live badge, go-live button, aur hamara
    // apna loading/error UI kabhi dikhta hi nahi tha: sirf bare native
    // <video controls> element reh jaata tha.
    try {
        if (window.__hlsLoadFailed || typeof Hls === 'undefined') {
            throw new Error('hls-lib-unavailable');
        }

        if (Hls.isSupported()) {
            hls = new Hls({
                liveDurationInfinity: true,
                enableWorker: true
            });

            hls.loadSource(url);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(function() {});
            });

            hls.on(Hls.Events.LEVEL_LOADED, function(_evt, data) {
                isLive = !!(data && data.details && data.details.live);
                liveBadge.classList.toggle('show', isLive);
                goLiveBtn.classList.toggle('show', isLive);
                checkLiveEdge();
            });

            hls.on(Hls.Events.ERROR, function(_, data) {
                if (data.fatal) {
                    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                        hls.startLoad();
                    } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                        hls.recoverMediaError();
                    } else {
                        showError('Stream error — refresh the page.');
                    }
                }
            });

        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            isLive = true; // Safari native HLS doesn't expose this easily; assume live.
            liveBadge.classList.add('show');
            goLiveBtn.classList.add('show');
            video.addEventListener('loadedmetadata', function() {
                video.play().catch(function() {});
            });
        } else {
            showError('HLS not supported');
        }
    } catch (e) {
        if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // hls.js load failed but native HLS is available (Safari) —
            // fall back instead of leaving the player fully broken.
            video.src = url;
            isLive = true;
            liveBadge.classList.add('show');
            goLiveBtn.classList.add('show');
            video.addEventListener('loadedmetadata', function() {
                video.play().catch(function() {});
            });
        } else {
            showError('Player library failed to load — check connection & refresh.');
        }
    }
})();
</script>

</body>
</html>
