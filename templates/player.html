<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Live Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

.player-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
}

#video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

/* Simple Live Badge */
.live-badge {
    position: absolute;
    top: 16px;
    left: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 0, 0, 0.7);
    padding: 5px 12px 5px 10px;
    border-radius: 4px;
    z-index: 10;
    pointer-events: none;
    border-left: 3px solid #ff2d2d;
}

.live-dot {
    width: 8px;
    height: 8px;
    background: #ff2d2d;
    border-radius: 50%;
    animation: blink 1s ease-in-out infinite;
}

.live-text {
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
}

/* Loading */
.loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255, 255, 255, 0.3);
    font-size: 13px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    z-index: 1;
    text-align: center;
}

.spinner {
    width: 32px;
    height: 32px;
    margin: 0 auto 12px;
    border: 2px solid rgba(255, 255, 255, 0.06);
    border-top: 2px solid rgba(255, 255, 255, 0.25);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="player-wrapper">
    <div class="loading" id="loading">
        <div class="spinner"></div>
        Loading...
    </div>

    <div class="live-badge">
        <div class="live-dot"></div>
        <span class="live-text">LIVE</span>
    </div>

    <video id="video" controls autoplay playsinline></video>
</div>

<script>
(function() {
    const video = document.getElementById('video');
    const loading = document.getElementById('loading');

    // 👇 URL page ke query parameter se aayega, e.g. mah.html?url=https://yoursite.com/stream.m3u8
    const params = new URLSearchParams(window.location.search);
    const url = params.get('url');

    if (!url) {
        loading.innerHTML = '✕ No stream URL provided (?url=...)';
        loading.style.color = 'rgba(255, 45, 45, 0.6)';
        document.querySelector('.spinner').style.display = 'none';
        return;
    }

    video.addEventListener('canplay', function() {
        loading.style.display = 'none';
    });

    video.addEventListener('error', function() {
        loading.innerHTML = '✕ Failed to load';
        loading.style.color = 'rgba(255, 45, 45, 0.6)';
        document.querySelector('.spinner').style.display = 'none';
    });

    if (Hls.isSupported()) {
        const hls = new Hls({
            liveDurationInfinity: true,
            enableWorker: true
        });

        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play().catch(function() {});
        });

        hls.on(Hls.Events.ERROR, function(_, data) {
            if (data.fatal) {
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    hls.startLoad();
                } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                    hls.recoverMediaError();
                }
            }
        });

    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari / iOS native HLS support
        video.src = url;
        video.addEventListener('loadedmetadata', function() {
            video.play().catch(function() {});
        });
    } else {
        loading.innerHTML = '✕ HLS not supported';
        loading.style.color = 'rgba(255, 45, 45, 0.6)';
        document.querySelector('.spinner').style.display = 'none';
    }
})();
</script>

</body>
</html>
